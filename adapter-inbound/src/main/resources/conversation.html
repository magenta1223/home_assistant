<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Home Second Brain · 대화</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, Pretendard, system-ui, sans-serif;
      background: #f4f1ea;
      color: #1d2a26;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background: radial-gradient(circle at top left, #dceadf 0, transparent 34rem), #f4f1ea;
    }
    main {
      width: min(780px, calc(100% - 32px));
      margin: 36px auto;
      padding-bottom: env(safe-area-inset-bottom);
    }
    nav { display: flex; gap: 8px; margin-bottom: 20px; }
    nav a {
      color: #1e5b46;
      background: rgba(255,255,255,.72);
      border: 1px solid #d9ded8;
      border-radius: 999px;
      padding: 8px 13px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
    }
    nav a[aria-current="page"] { color: white; background: #1e5b46; border-color: #1e5b46; }
    header { margin-bottom: 22px; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 42px); letter-spacing: -0.04em; }
    header p { margin: 0; color: #607069; }
    .panel {
      background: rgba(255,255,255,.88);
      border: 1px solid #d9ded8;
      border-radius: 22px;
      box-shadow: 0 22px 55px rgba(36,53,46,.09);
      overflow: hidden;
    }
    .auth {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: end;
      padding: 18px 20px;
      border-bottom: 1px solid #e1e5e1;
      background: rgba(250,251,249,.8);
    }
    .auth > div, .composer > div { min-width: 0; }
    label { display: block; margin-bottom: 7px; color: #43524c; font-size: 13px; font-weight: 800; }
    input, textarea, button { font: inherit; }
    input, textarea {
      width: 100%;
      border: 1px solid #cbd3cd;
      border-radius: 12px;
      padding: 12px 13px;
      background: #fff;
      color: #1d2a26;
      outline: none;
    }
    input:focus, textarea:focus { border-color: #3f8068; box-shadow: 0 0 0 3px rgba(63,128,104,.13); }
    .hint { margin-top: 6px; color: #738079; font-size: 12px; }
    #connection {
      align-self: center;
      min-width: 72px;
      padding: 7px 10px;
      border-radius: 999px;
      background: #e8eee9;
      color: #52635b;
      text-align: center;
      font-size: 12px;
      font-weight: 800;
    }
    #connection[data-state="ready"] { background: #dcefe5; color: #1e654a; }
    #connection[data-state="error"] { background: #f7dfdc; color: #8a332b; }
    #messages {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 360px;
      max-height: min(58vh, 620px);
      overflow-y: auto;
      padding: 22px 20px;
      scroll-behavior: smooth;
    }
    .message { display: flex; flex-direction: column; max-width: min(86%, 620px); }
    .message.user { align-self: flex-end; align-items: flex-end; }
    .message.assistant { align-self: flex-start; }
    .speaker { margin: 0 4px 5px; color: #7b8781; font-size: 11px; font-weight: 800; }
    .bubble {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      border-radius: 17px;
      padding: 12px 14px;
      line-height: 1.55;
    }
    .assistant .bubble { background: #e8eee9; color: #273a32; border-bottom-left-radius: 5px; }
    .user .bubble { background: #1e5b46; color: white; border-bottom-right-radius: 5px; }
    .message.error .bubble { background: #f7dfdc; color: #7d2c25; }
    .message.pending .bubble { color: #67766f; }
    .composer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: end;
      padding: 16px 20px 20px;
      border-top: 1px solid #e1e5e1;
      background: rgba(250,251,249,.92);
    }
    textarea { min-height: 54px; max-height: 180px; resize: vertical; line-height: 1.45; }
    button {
      min-width: 82px;
      height: 48px;
      border: 0;
      border-radius: 13px;
      padding: 0 18px;
      background: #1e5b46;
      color: white;
      font-weight: 800;
      cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: wait; }
    @media (max-width: 620px) {
      main { width: min(100% - 20px, 780px); margin: 18px auto; }
      .auth { grid-template-columns: 1fr; padding: 16px; }
      #connection { justify-self: start; }
      #messages { min-height: 44vh; max-height: 56vh; padding: 18px 14px; }
      .message { max-width: 92%; }
      .composer { padding: 12px 14px calc(14px + env(safe-area-inset-bottom)); }
      button { min-width: 68px; padding: 0 14px; }
    }
  </style>
</head>
<body>
<main>
  <nav aria-label="주요 기능">
    <a href="/conversation" aria-current="page">대화</a>
    <a href="/knowledge">지식 주입</a>
  </nav>
  <header>
    <h1>Memory Conversation</h1>
    <p>내가 볼 수 있는 기억을 바탕으로 second brain에 질문합니다.</p>
  </header>
  <section class="panel" aria-label="메모리 대화">
    <div class="auth">
      <div>
        <label for="token">API 토큰</label>
        <input id="token" type="password" autocomplete="current-password" placeholder="발급받은 토큰 입력">
        <div class="hint">토큰은 이 페이지에서 저장하지 않으며 현재 탭에서만 사용합니다.</div>
      </div>
      <div id="connection" data-state="idle" role="status">토큰 필요</div>
    </div>
    <div id="messages" role="log" aria-live="polite" aria-relevant="additions">
      <div class="message assistant">
        <div class="speaker">Second Brain</div>
        <div class="bubble">기억에 관해 궁금한 내용을 물어보세요. 마지막 대화 후 10분 동안 문맥이 이어집니다.</div>
      </div>
    </div>
    <form id="conversation-form" class="composer">
      <div>
        <label for="question">질문</label>
        <textarea id="question" maxlength="10000" placeholder="예: 지난번에 정한 가족 여행 준비사항이 뭐였지?"></textarea>
        <div class="hint">Enter로 전송 · Shift+Enter로 줄바꿈</div>
      </div>
      <button id="send" type="submit">전송</button>
    </form>
  </section>
</main>
<script>
  const token = document.getElementById('token');
  const question = document.getElementById('question');
  const send = document.getElementById('send');
  const messages = document.getElementById('messages');
  const connection = document.getElementById('connection');

  token.addEventListener('input', function () {
    setConnection(token.value.trim() ? 'ready' : 'idle', token.value.trim() ? '전송 준비' : '토큰 필요');
  });

  question.addEventListener('keydown', function (event) {
    if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      document.getElementById('conversation-form').requestSubmit();
    }
  });

  document.getElementById('conversation-form').addEventListener('submit', async function (event) {
    event.preventDefault();
    const apiToken = token.value.trim();
    const text = question.value.trim();
    if (!apiToken) {
      setConnection('error', '토큰 필요');
      token.focus();
      return;
    }
    if (!text) {
      question.focus();
      return;
    }

    appendMessage('user', '나', text);
    question.value = '';
    const pending = appendMessage('assistant pending', 'Second Brain', '기억을 찾는 중…');
    setBusy(true);
    setConnection('ready', '응답 대기');

    try {
      const response = await fetch('/api/memory/conversation', {
        method: 'POST',
        headers: {
          Authorization: 'Bearer ' + apiToken,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ requestId: createRequestId(), question: text })
      });
      const body = await readJson(response);
      if (!response.ok) throw new ConversationError(response.status, body.error);
      pending.className = 'message assistant';
      pending.querySelector('.bubble').textContent = body.answer;
      setConnection('ready', '연결됨');
    } catch (error) {
      pending.className = 'message assistant error';
      pending.querySelector('.bubble').textContent = errorMessage(error);
      setConnection('error', error instanceof ConversationError && error.status === 401 ? '인증 실패' : '전송 실패');
    } finally {
      setBusy(false);
      messages.scrollTop = messages.scrollHeight;
      question.focus();
    }
  });

  function appendMessage(className, speaker, text) {
    const item = document.createElement('div');
    item.className = 'message ' + className;
    const name = document.createElement('div');
    name.className = 'speaker';
    name.textContent = speaker;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    item.append(name, bubble);
    messages.appendChild(item);
    messages.scrollTop = messages.scrollHeight;
    return item;
  }

  function setBusy(isBusy) {
    send.disabled = isBusy;
    question.disabled = isBusy;
    token.disabled = isBusy;
  }

  function setConnection(state, text) {
    connection.dataset.state = state;
    connection.textContent = text;
  }

  function createRequestId() {
    if (typeof crypto.randomUUID === 'function') return crypto.randomUUID();
    const bytes = crypto.getRandomValues(new Uint8Array(16));
    bytes[6] = (bytes[6] & 0x0f) | 0x40;
    bytes[8] = (bytes[8] & 0x3f) | 0x80;
    const hex = Array.from(bytes, function (byte) { return byte.toString(16).padStart(2, '0'); }).join('');
    return hex.slice(0, 8) + '-' + hex.slice(8, 12) + '-' + hex.slice(12, 16) + '-' + hex.slice(16, 20) + '-' + hex.slice(20);
  }

  async function readJson(response) {
    try {
      return await response.json();
    } catch (_) {
      return {};
    }
  }

  function ConversationError(status, message) {
    this.status = status;
    this.message = message || '';
  }

  function errorMessage(error) {
    if (!(error instanceof ConversationError)) return '서버에 연결하지 못했습니다. 잠시 후 다시 시도하세요.';
    if (error.status === 401) return 'API 토큰이 유효하지 않습니다.';
    if (error.status === 409) return '같은 요청을 처리 중입니다. 잠시 후 다시 질문하세요.';
    if (error.status === 503) return '대화 서비스를 지금 사용할 수 없습니다. 잠시 후 다시 시도하세요.';
    if (error.status === 400) return '질문 형식이 올바르지 않습니다.';
    return error.message || '답변을 가져오지 못했습니다.';
  }
</script>
</body>
</html>
